    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: postgresql://postgres.tgctyouhzsyizlosrmqh:euKpcT2ScEMIaHMW@aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres
      - key: JWT_SECRET_KEY
        value: 9f8234ab8e76c12d3450918ef029c81726a45b9012cd34ef567890abcdef1234
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: AUTH_PROVIDER
        value: local
      - key: STORAGE_PATH
        value: ./storage
      - key: CORS_ORIGINS
        value: '["*"]'
