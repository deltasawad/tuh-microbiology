<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUH CMLAR E-Report</title>
  
  <!-- 1. โหลด Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 2. โหลด Google Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  
  <!-- 3. โหลด React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 4. โหลด Babel สำหรับแปลง JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- 5. สไตล์ชีตสำหรับการพิมพ์ (Print) และการตั้งค่าหน้ากระดาษ -->
  <style>
    body { font-family: 'Noto Sans Thai', sans-serif; background-color: #f1f5f9; }
    
    @media print {
      body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; background: white !important; font-family: 'Arial', sans-serif !important; }
      .screen-only { display: none !important; }
      .print-only { display: block !important; }
      
      /* ควบคุมการซ่อน/แสดง โหมดการพิมพ์ */
      #app-container:not(.printing-single):not(.printing-receipt) .print-single-wrapper,
      #app-container:not(.printing-single):not(.printing-receipt) .print-receipt-wrapper { display: none !important; }
      
      #app-container.printing-single .print-main-wrapper,
      #app-container.printing-single .print-receipt-wrapper { display: none !important; }
      
      #app-container.printing-receipt .print-main-wrapper,
      #app-container.printing-receipt .print-single-wrapper { display: none !important; }
      
      /* Styles แบบฟอร์มหลัก */
      table { page-break-inside: auto; border-collapse: collapse; }
      tr    { page-break-inside: avoid; page-break-after: auto; }
      .print-table th, .print-table td { border: 1px solid black; padding: 4px 8px; font-size: 11px; vertical-align: top; }
      .print-table th { background-color: #f3f4f6 !important; font-weight: bold; text-align: left;}

      /* Styles แบบฟอร์มเดี่ยว Biotyper */
      .saramis-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
      .saramis-table th, .saramis-table td { border: 1px solid black; padding: 6px 10px; font-size: 12px; }
      .saramis-table th { font-weight: normal; text-align: right; width: 25%; padding-right: 15px; }
      .saramis-table td { font-weight: normal; }

      @page { margin: 15mm; size: auto; }
      
      /* ทำให้พื้นที่พิมพ์เต็มจอซ่อน Navbar */
      body { padding: 0 !important; margin: 0 !important; }
      .print-single-wrapper, .print-receipt-wrapper { display: block !important; position: absolute; left: 0; top: 0; width: 100%; }
    }

    .watermark-overlay {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden; pointer-events: none; z-index: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .watermark-text {
      transform: rotate(-55deg);
      font-size: 48px; color: rgba(180, 180, 180, 0.25);
      font-weight: bold; white-space: nowrap; font-family: Arial, sans-serif;
    }
    .saramis-content { position: relative; z-index: 10; }
  </style>
</head>
<body>
  <!-- จุดที่แอป React จะโหลด -->
  <div id="root"></div>

  <!-- โค้ดโปรแกรม React -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // 🟢 ระบบจัดการไอคอน (แทนที่ lucide-react) 
    // ใช้ Material Symbols เพื่อให้เบาและเหมาะกับหน้าเว็บไฟล์เดียว
    // ==========================================
    const Icon = ({ name, className }) => {
      let sizeClass = 'text-base';
      if (className?.includes('w-3')) sizeClass = 'text-[12px]';
      if (className?.includes('w-3.5')) sizeClass = 'text-[14px]';
      if (className?.includes('w-4')) sizeClass = 'text-[16px]';
      if (className?.includes('w-5')) sizeClass = 'text-[20px]';
      if (className?.includes('w-6')) sizeClass = 'text-[24px]';
      if (className?.includes('w-7')) sizeClass = 'text-[28px]';
      if (className?.includes('w-8')) sizeClass = 'text-[32px]';
      if (className?.includes('w-10')) sizeClass = 'text-[40px]';
      if (className?.includes('w-12')) sizeClass = 'text-[48px]';
      return <span className={`material-symbols-outlined ${sizeClass} ${className || ''}`} style={{display: 'flex', alignItems: 'center', justifyContent: 'center'}}>{name}</span>;
    }

    const Search = (p) => <Icon name="search" {...p} />;
    const Microscope = (p) => <Icon name="biotech" {...p} />;
    const User = (p) => <Icon name="person" {...p} />;
    const FileText = (p) => <Icon name="description" {...p} />;
    const CheckCircle = (p) => <Icon name="check_circle" {...p} />;
    const CheckCircle2 = (p) => <Icon name="check_circle" {...p} />;
    const Printer = (p) => <Icon name="print" {...p} />;
    const ChevronLeft = (p) => <Icon name="chevron_left" {...p} />;
    const ChevronRight = (p) => <Icon name="chevron_right" {...p} />;
    const Info = (p) => <Icon name="info" {...p} />;
    const AlertCircle = (p) => <Icon name="error" {...p} />;
    const FlaskConical = (p) => <Icon name="science" {...p} />;
    const Activity = (p) => <Icon name="monitoring" {...p} />;
    const Database = (p) => <Icon name="database" {...p} />;
    const Loader2 = (p) => <Icon name="sync" className={p.className + " animate-spin"} />;
    const X = (p) => <Icon name="close" {...p} />;
    const Filter = (p) => <Icon name="filter_alt" {...p} />;
    const Settings = (p) => <Icon name="settings" {...p} />;
    const Settings2 = (p) => <Icon name="tune" {...p} />;
    const Edit = (p) => <Icon name="edit" {...p} />;
    const Trash2 = (p) => <Icon name="delete" {...p} />;
    const Plus = (p) => <Icon name="add" {...p} />;
    const Save = (p) => <Icon name="save" {...p} />;
    const List = (p) => <Icon name="list" {...p} />;
    const FileOutput = (p) => <Icon name="output" {...p} />;
    const Eye = (p) => <Icon name="visibility" {...p} />;
    const Lock = (p) => <Icon name="lock" {...p} />;
    const Clock = (p) => <Icon name="schedule" {...p} />;
    const PackageSearch = (p) => <Icon name="inventory_2" {...p} />;
    const BarChart3 = (p) => <Icon name="bar_chart" {...p} />;
    const TrendingUp = (p) => <Icon name="trending_up" {...p} />;
    const Beaker = (p) => <Icon name="experiment" {...p} />;
    const QrCode = (p) => <Icon name="qr_code" {...p} />;
    const Download = (p) => <Icon name="download" {...p} />;
    const Sparkles = (p) => <Icon name="auto_awesome" {...p} />;
    const Bot = (p) => <Icon name="robot_2" {...p} />;


    // ==========================================
    // 🟢 กำหนดค่า API และ Gemini
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbwfPwXOtGSEUH1KrxzGThr81mu7qyR9p_Z8D9Yk-CA7hwBez_AAMRMZcf8y0aPOHfiY5Q/exec"; 
    const apiKey = ""; 

    const TELEGRAM_BOT_TOKEN = 'REMOVED__USE_ENV_TELEGRAM_BOT_TOKEN';
    const TELEGRAM_CHAT_ID = '-5294922475';

    const sendTelegramNotification = async (data) => {
      const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
      const message = `🔔 *อัปเดตข้อมูลใบส่งตรวจ*\n\n*รหัสส่งตรวจ:* ${data.receivedNumber}\n*สถานะ:* ${data.status}\n*ลูกค้า:* ${data.customer?.name || '-'}\n*จำนวนรายการทดสอบ:* ${data.results?.length || 0} รายการ\n*เวลาอัปเดต:* ${new Date().toLocaleString('th-TH')}`;
      try {
        await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: message, parse_mode: 'Markdown' }) });
      } catch (error) {}
    };

    const callGeminiAPI = async (prompt, retries = 5) => {
      const delays = [1000, 2000, 4000, 8000, 16000];
      for (let i = 0; i <= retries; i++) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              systemInstruction: { parts: [{ text: "You are a professional clinical microbiologist assistant. Provide concise, accurate, and scientifically sound information. Respond in Thai language, using English for medical/scientific terms." }] }
            })
          });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const data = await response.json();
          return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        } catch (err) {
          if (i === retries) throw err;
          await new Promise(res => setTimeout(res, delays[i]));
        }
      }
    };

    const fetchJSONP = (url, params) => {
      return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
        const script = document.createElement('script');
        window[callbackName] = (data) => { resolve(data); document.body.removeChild(script); delete window[callbackName]; };
        const queryString = new URLSearchParams({ ...params, callback: callbackName }).toString();
        script.src = `${url}?${queryString}`;
        script.onerror = () => { reject(new Error('เกิดข้อผิดพลาดในการเชื่อมต่อ (JSONP Failed)')); document.body.removeChild(script); delete window[callbackName]; };
        document.body.appendChild(script);
      });
    };

    // ==========================================
    // 🟢 เมนแอปพลิเคชัน (App Component)
    // ==========================================
    function App() {
      const [view, setView] = useState('search'); 
      const [searchKey, setSearchKey] = useState('');
      const [error, setError] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [reportData, setReportData] = useState(null);
      
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [loginCreds, setLoginCreds] = useState({ username: '', password: '' });
      const [allReports, setAllReports] = useState([]);
      const [topBacteriaStats, setTopBacteriaStats] = useState([]); 
      const [formData, setFormData] = useState(getInitialForm());
      const [deleteTarget, setDeleteTarget] = useState({ show: false, receivedNumber: '' });
      const [previewModal, setPreviewModal] = useState({ show: false, data: null });
      const [tableFilter, setTableFilter] = useState('');
      const [notification, setNotification] = useState({ show: false, type: '', title: '', text: '', html: '', autoClose: 0 });

      const [adminTab, setAdminTab] = useState('all'); 
      const [activeFormTab, setActiveFormTab] = useState(1); 

      const [biotyperEditModal, setBiotyperEditModal] = useState({ show: false, rowIndex: null, data: null });
      const [singlePrintData, setSinglePrintData] = useState(null);
      const [receiptData, setReceiptData] = useState(null); 

      const [formErrors, setFormErrors] = useState([]); 
      const [draftPrompt, setDraftPrompt] = useState(false);
      const [isGeneratingComment, setIsGeneratingComment] = useState(false);

      useEffect(() => {
        const urlParams = new URLSearchParams(window.location.search);
        const idParam = urlParams.get('id');
        if (idParam) { setSearchKey(idParam); fetchReportData(idParam); }
      }, []);

      useEffect(() => {
        let timer;
        if (notification.show && notification.autoClose > 0) {
          timer = setTimeout(() => { setNotification(prev => ({ ...prev, show: false })); }, notification.autoClose);
        }
        return () => clearTimeout(timer);
      }, [notification]);

      useEffect(() => {
        if (view === 'form' && formData) {
          if (formData.receivedNumber || formData.customer?.name || formData.results?.length > 0) {
            localStorage.setItem('tucsear_draft', JSON.stringify(formData));
          }
        }
      }, [formData, view]);

      const fetchReportData = async (idToSearch) => {
        setIsLoading(true); setError('');
        const safeId = String(idToSearch || '').trim();
        const safeIdUpper = safeId.toUpperCase();
        
        try {
          const result = await fetchJSONP(API_URL, { action: 'read', received_number: safeId });
          if (result.status === 'success') { setReportData(result.data); setView('report'); } 
          else if (result.status === 'not_found') { setError('ไม่พบข้อมูลรหัสส่งตรวจนี้ในระบบฐานข้อมูล'); } 
          else { setError(result.message || 'เกิดข้อผิดพลาดในการดึงข้อมูล'); }
        } catch (err) {
          if (safeIdUpper === 'R2-630349') { setError('เชื่อมต่อ API ไม่สำเร็จ ระบบจึงแสดงผลจำลอง'); setReportData(getMockData('ผลออกแล้ว')); setView('report'); } 
          else { setError('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (Failed to fetch)'); }
        } finally { setIsLoading(false); }
      };

      const handleSearch = (e) => {
        e?.preventDefault();
        if (!String(searchKey || '').trim()) { setError('กรุณากรอกรหัสส่งตรวจ'); return; }
        fetchReportData(searchKey);
      };

      const handleAdminClick = () => { if (isLoggedIn) { loadAllReports(); } else { setShowLoginModal(true); } };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        if (loginCreds.username === 'admin' && loginCreds.password === '1234') {
          setIsLoggedIn(true); setShowLoginModal(false); setLoginCreds({ username: '', password: '' }); loadAllReports();
          if (localStorage.getItem('tucsear_draft')) { setDraftPrompt(true); }
        } else {
          setNotification({ show: true, type: 'error', title: 'เข้าสู่ระบบล้มเหลว', text: 'Username หรือ Password ไม่ถูกต้อง' });
        }
      };

      const loadAllReports = async () => {
        setView('admin'); setReportData(null); 
        setNotification({ show: true, type: 'loading', title: 'กำลังดึงข้อมูล...', text: 'โปรดรอสักครู่ ระบบกำลังโหลดข้อมูลและสถิติจาก Google Sheets' });
        try {
          const result = await fetchJSONP(API_URL, { action: 'readAll' });
          if (result.status === 'success') {
            setAllReports((result.data?.orders || []).reverse());
            setTopBacteriaStats(result.data?.topBacteria || []);
            setNotification({ show: false });
          } else {
            const mockAdmin = getMockAdminList(); setAllReports(mockAdmin.orders); setTopBacteriaStats(mockAdmin.topBacteria); setNotification({ show: false });
          }
        } catch (err) {
          const mockAdmin = getMockAdminList(); setAllReports(mockAdmin.orders); setTopBacteriaStats(mockAdmin.topBacteria); setNotification({ show: false });
        }
      };

      const handleSaveForm = async (e) => {
        e.preventDefault();
        const safeReceivedNumber = String(formData.receivedNumber || '').trim();
        if (!safeReceivedNumber) { 
           setFormErrors(['receivedNumber']); 
           setNotification({ show: true, type: 'warning', title: 'แจ้งเตือน', text: 'กรุณาระบุ Received Number ในแท็บแรก' }); 
           setActiveFormTab(1); 
           return; 
        }
        setFormErrors([]); 
        setNotification({ show: true, type: 'loading', title: 'กำลังบันทึกข้อมูล...', html: 'ระบบกำลังส่งข้อมูลไปยัง <b>Google Sheets</b>' });

        try {
          const dataString = JSON.stringify(formData);
          const result = await fetchJSONP(API_URL, { action: 'save', data: dataString });
          if (result.status === 'success') {
            localStorage.removeItem('tucsear_draft'); 
            setNotification({ show: true, type: 'success', title: 'บันทึกสำเร็จ!', text: 'ข้อมูลถูกบันทึกและอัปเดตแบบถาวรแล้ว', autoClose: 2000 });
            loadAllReports();
            sendTelegramNotification(formData); 
          } else {
            setNotification({ show: true, type: 'error', title: 'ข้อผิดพลาด', text: result.message || 'บันทึกไม่สำเร็จ' });
          }
        } catch (err) {
          localStorage.removeItem('tucsear_draft'); 
          setNotification({ show: true, type: 'success', title: 'จำลองการบันทึกสำเร็จ', text: 'เนื่องจากไม่ได้ผูก API จริง ระบบจึงอัปเดตสถานะจำลอง', autoClose: 2000 });
          setAllReports(prev => {
            const existingIdx = prev.findIndex(r => r.receivedNumber === formData.receivedNumber);
            const updated = [...prev];
            const newRecord = { receivedNumber: formData.receivedNumber, date: formData.date || new Date().toLocaleDateString(), status: formData.status, customerName: formData.customer?.name || '-' };
            if (existingIdx >= 0) { updated[existingIdx] = newRecord; } else { updated.unshift(newRecord); }
            return updated;
          });
          setView('admin');
          sendTelegramNotification(formData); 
        }
      };

      const handleViewReport = async (receivedNo) => {
        setNotification({ show: true, type: 'loading', title: 'กำลังโหลดข้อมูลรายงาน...', text: 'โปรดรอสักครู่...' });
        try {
          const safeId = String(receivedNo || '').trim();
          const result = await fetchJSONP(API_URL, { action: 'read', received_number: safeId });
          if (result.status === 'success') {
            setPreviewModal({ show: true, data: result.data });
            setNotification({ show: false });
          } else {
            setNotification({ show: true, type: 'error', title: 'ไม่พบข้อมูล', text: result.message || 'เกิดข้อผิดพลาดในการดึงข้อมูล' });
          }
        } catch (err) {
          setPreviewModal({ show: true, data: getMockData('ผลออกแล้ว', receivedNo) });
          setNotification({ show: false });
        }
      };

      const handlePrintReceipt = async (receivedNo) => {
        setNotification({ show: true, type: 'loading', title: 'กำลังสร้างใบรับตัวอย่าง...', text: 'โปรดรอสักครู่...' });
        try {
          const safeId = String(receivedNo || '').trim();
          const result = await fetchJSONP(API_URL, { action: 'read', received_number: safeId });
          if (result.status === 'success') {
            setReceiptData(result.data);
            setNotification({ show: false });
          } else {
            setNotification({ show: true, type: 'error', title: 'ไม่พบข้อมูล', text: 'ไม่สามารถสร้างสลิปได้' });
          }
        } catch (err) {
          setReceiptData(getMockData('รอรับตัวอย่าง', receivedNo));
          setNotification({ show: false });
        }
      };

      const confirmDelete = async () => {
        const targetId = deleteTarget.receivedNumber;
        setDeleteTarget({ show: false, receivedNumber: '' });
        setNotification({ show: true, type: 'loading', title: 'กำลังลบข้อมูล...', text: 'โปรดรอสักครู่...' });
        try {
          const result = await fetchJSONP(API_URL, { action: 'delete', received_number: targetId });
          if (result.status === 'success') {
            setNotification({ show: true, type: 'success', title: 'ลบสำเร็จ!', text: `รายการ ${targetId} ถูกลบออกจากระบบแล้ว`, autoClose: 2000 });
            loadAllReports();
          } else {
            setNotification({ show: true, type: 'error', title: 'ข้อผิดพลาด', text: result.message || 'ลบไม่สำเร็จ' });
          }
        } catch (err) {
          setNotification({ show: true, type: 'success', title: 'จำลองลบสำเร็จ!', text: `รายการ ${targetId} ถูกลบ (โหมดจำลอง)`, autoClose: 2000 });
          setAllReports(prev => prev.filter(r => r.receivedNumber !== targetId));
        }
      };

      function getInitialForm() {
        return {
          receivedNumber: '', reportNumber: '', referenceQuotation: '', date: '', status: 'รอรับตัวอย่าง', 
          customer: { name: '', address: '' },
          sample: { 
            sampleNameSummary: '', receivedBy: '', testedBy: '', testedSampleStatus: 'Out of sample', 
            targetedAnalyte: 'Bacteria Identification', dataStorage: 'Yes', storageTimeYear: '5', 
            description: '', testReportFormat: 'Paper', reportCopies: '1', 
            receivedDate: '', testedDate: '' 
          },
          method: {
            technique: 'Matrix Assisted Laser Desorption Ionization-Time of Flight Mass Spectrometry (MALDI-TOF MS)',
            model: 'Microflex LT/SH, Bruker Daltonics, Germany',
            software: 'MALDI Biotyper',
            conditionType: 'Bacteria Identification', conditionMode: 'MBT Compass', conditionMatrix: 'HCCA, Bruker Daltonics, Germany',
            standardMaterial: 'Bacterial Test Standard (BTS), Bruker Daltonics',
            internalStandardMaterial: '-',
            remark: '-'
          },
          results: []
        };
      }

      const handleEdit = async (receivedNo) => {
        setNotification({ show: true, type: 'loading', title: 'กำลังโหลดข้อมูล...', text: 'โปรดรอสักครู่...' });
        try {
          const result = await fetchJSONP(API_URL, { action: 'read', received_number: receivedNo });
          if (result.status === 'success') {
            const mergedData = {
               ...getInitialForm(),
               ...result.data,
               status: result.data.status || 'รอรับตัวอย่าง',
               customer: { ...getInitialForm().customer, ...(result.data.customer || {}) },
               sample: { ...getInitialForm().sample, ...(result.data.sample || {}) },
               method: { ...getInitialForm().method, ...(result.data.method || {}) }
            };
            setFormData(mergedData);
            setNotification({ show: false });
            setActiveFormTab(1); 
            setView('form');
          } else {
            setNotification({ show: true, type: 'error', title: 'ข้อผิดพลาด', text: 'โหลดข้อมูลไม่สำเร็จ' });
          }
        } catch (err) {
          setFormData(getMockData('ผลออกแล้ว', receivedNo));
          setNotification({ show: false });
          setActiveFormTab(1);
          setView('form');
        }
      };

      const addResultRow = () => { 
        setFormData({ 
          ...formData, 
          results: [...(formData.results || []), { 
            no: (formData.results?.length || 0) + 1, sampleName: '', conf: '', family: '', genus: '', species: '',

                      <div className="mb-4"><div className="italic font-bold mb-1 text-[13px]">Sample Information</div><table className="w-full print-table"><tbody><tr><td className="w-[25%] align-top">Sample Name</td><td className="w-[40%] align-top border-r-0 whitespace-pre-wrap leading-relaxed">{pData.sample?.sampleNameSummary || '-'}</td><td className="w-[35%] align-top border-l-0"><div>Received by {pData.sample?.receivedBy || '.........'}</div><div className="mt-1">Tested by {pData.sample?.testedBy || '.........'}</div><div className="mt-1">Tested Sample:</div><div className="mt-1">{renderCheck(pData.sample?.testedSampleStatus === 'Out of sample', 'Out of sample')}{renderCheck(pData.sample?.testedSampleStatus === 'Return', 'Return')}{renderCheck(pData.sample?.testedSampleStatus === 'No Return', 'No Return')}</div></td></tr><tr><td className="align-top">Targeted Analyte/Analytes</td><td className="align-top border-r-0">{pData.sample?.targetedAnalyte || '-'}</td><td className="align-top border-l-0"><div>Data Storage:</div><div className="mt-1">{renderCheck(pData.sample?.dataStorage === 'Yes', 'Yes')}{renderCheck(pData.sample?.dataStorage === 'No', 'No')}</div><div className="mt-1 flex items-center">Storage time: <span className="border-b border-dotted border-black flex-1 mx-1 text-center font-bold">{pData.sample?.storageTimeYear || ''}</span> Year</div></td></tr><tr><td className="align-top">Sample Description</td><td className="align-top border-r-0">{pData.sample?.description || '-'}</td><td className="align-top border-l-0"><div>Test Report:</div><div className="mt-1">{renderCheck(pData.sample?.testReportFormat === 'CD', 'CD')}{renderCheck(pData.sample?.testReportFormat === 'DVD', 'DVD')}{renderCheck(pData.sample?.testReportFormat === 'Paper', 'Paper')}{renderCheck(pData.sample?.testReportFormat === 'Other File', 'Other File')}</div><div className="mt-1 flex items-center">Number of copies: <span className="border-b border-dotted border-black flex-1 ml-1 text-center font-bold">{pData.sample?.reportCopies || ''}</span></div></td></tr><tr><td>Sample Received Date</td><td colSpan="2">{pData.sample?.receivedDate || '-'}</td></tr><tr><td>Sample Tested Date</td><td colSpan="2">{pData.sample?.testedDate || '-'}</td></tr></tbody></table></div>
                      <div className="mb-4"><div className="italic font-bold mb-1 text-[13px]">Method Information</div><table className="w-full print-table"><tbody><tr><td className="w-[25%] align-top">Method/Technique</td><td className="w-[75%] align-top leading-relaxed">{pData.method?.technique || '-'}<br/>Model: {pData.method?.model || '-'}<br/>Software: {pData.method?.software || '-'}</td></tr><tr><td className="align-top">Condition</td><td className="align-top"><table className="w-full border-0"><tbody><tr><td className="border-0 p-0 w-[50px]">Type</td><td className="border-0 p-0">: {pData.method?.conditionType || '-'}</td></tr><tr><td className="border-0 p-0 pt-1">Mode</td><td className="border-0 p-0 pt-1">: {pData.method?.conditionMode || '-'}</td></tr><tr><td className="border-0 p-0 pt-1 align-top">Matrix</td><td className="border-0 p-0 pt-1 align-top">: {pData.method?.conditionMatrix || '-'}</td></tr></tbody></table></td></tr><tr><td>Standard Material</td><td>{pData.method?.standardMaterial || '-'}</td></tr><tr><td>Internal Standard Material</td><td>{pData.method?.internalStandardMaterial || '-'}</td></tr><tr><td>Remark</td><td>{pData.method?.remark || '-'}</td></tr></tbody></table></div>

                      {(pData.results && pData.results.length > 0) && (
                        <div className="mb-4 mt-6">
                          <div className="italic font-bold mb-1 text-[13px]">Test Results:</div>
                          <table className="w-full print-table text-[11px]">
                            <thead><tr><th className="w-10 text-center">No.</th><th>Sample Name</th><th className="text-center">Score (Log)</th><th>Family</th><th>Genus</th><th>Species</th></tr></thead>
                            <tbody>{pData.results.map((item, idx) => {
                              const scoreVal = item.conf || item.saramis?.scoreValue;
                              const numScore = parseFloat(scoreVal);
                              return (
                                <tr key={idx} className="page-break-inside-avoid">
                                  <td className="text-center">{item.no || (idx+1)}</td>
                                  <td>{item.sampleName || '-'}</td>
                                  <td className="text-center font-bold">{!isNaN(numScore) ? numScore.toFixed(2) : (scoreVal || '-')}</td>
                                  <td>{item.family || '-'}</td>
                                  <td className="italic">{item.genus || '-'}</td>
                                  <td className="italic font-semibold">{item.species || '-'}</td>
                                </tr>
                              );
                            })}</tbody>
                          </table>
                        </div>
                      )}

                      <div className="mt-10 pt-4">
                        <div className="flex items-end text-[12px] mb-12"><span className="font-bold mr-3">Remarks:</span><div className="flex-1 flex items-end"><div className="border-b-2 border-dotted border-gray-500 flex-1 h-4"></div><div className="px-3 pb-0 text-gray-500 font-bold">-</div><div className="border-b-2 border-dotted border-gray-500 flex-1 h-4"></div></div></div>
                        <div className="text-center font-bold text-[14px] mt-12 pb-8">*** End of Report ***</div>
                      </div>
                    </td>
                  </tr>
                </tbody>
                <tfoot className="table-footer-group"><tr><td className="h-8"></td></tr></tfoot>
              </table>
            </div>
            );
          })()}

          {/* ========================================================================= */}
          {/* OTHER MODALS */}
          {/* ========================================================================= */}
          {showLoginModal && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200 screen-only">
              <div className="bg-white rounded-[2rem] w-full max-w-sm flex flex-col shadow-2xl relative overflow-hidden animate-in zoom-in-95 duration-200 border border-slate-200 p-8">
                <button onClick={() => setShowLoginModal(false)} className="absolute top-4 right-4 p-2 bg-slate-50 hover:bg-slate-100 text-slate-400 hover:text-slate-600 rounded-full transition-colors"><X className="w-5 h-5"/></button>
                <div className="flex items-center justify-center w-20 h-20 bg-teal-50 text-teal-600 rounded-full mx-auto mb-6 shadow-inner border border-teal-100"><Lock className="w-10 h-10" /></div>
                <h3 className="text-2xl font-bold text-center text-slate-800 mb-2">เข้าสู่ระบบจัดการ</h3><p className="text-center text-slate-500 text-sm mb-6">สำหรับเจ้าหน้าที่ห้องปฏิบัติการเท่านั้น</p>
                <form onSubmit={handleLoginSubmit} className="space-y-4">
                  <div><label className="block text-xs font-semibold text-slate-600 mb-2 uppercase">Username</label><input type="text" required className="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all shadow-sm bg-slate-50 focus:bg-white" value={loginCreds.username || ''} onChange={(e) => setLoginCreds({...loginCreds, username: e.target.value})} placeholder="กรอกชื่อผู้ใช้"/></div>
                  <div><label className="block text-xs font-semibold text-slate-600 mb-2 uppercase">Password</label><input type="password" required className="w-full px-4 py-3 rounded-2xl border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition-all shadow-sm bg-slate-50 focus:bg-white" value={loginCreds.password || ''} onChange={(e) => setLoginCreds({...loginCreds, password: e.target.value})} placeholder="กรอกรหัสผ่าน"/></div>
                  <button type="submit" className="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-4 rounded-full shadow-md transition-all mt-4 text-lg">เข้าสู่ระบบ</button>
                </form>
              </div>
            </div>
          )}

          {/* หน้า Preview Report รวม */}
          {previewModal.show && previewModal.data && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-2 sm:p-6 animate-in fade-in duration-200 screen-only">
              <div className="bg-slate-100 rounded-[2rem] w-full max-w-6xl h-[95vh] sm:h-[90vh] flex flex-col shadow-2xl relative overflow-hidden animate-in zoom-in-95 duration-200 border border-slate-200">
                <div className="p-5 sm:px-8 border-b border-slate-200 flex justify-between items-center bg-white shadow-sm z-10">
                  <div className="flex items-center"><div className="w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center mr-3 text-blue-600"><Eye className="w-5 h-5"/></div><div><h3 className="font-bold text-lg text-slate-800">ตัวอย่างรายงานผลวิเคราะห์ (PDF)</h3><p className="text-xs text-slate-500">รหัส: {previewModal.data.receivedNumber || 'ยังไม่ระบุ'}</p></div></div>
                  <div className="flex flex-wrap items-center gap-2 sm:gap-3 w-full sm:w-auto mt-3 sm:mt-0">
                     <button onClick={triggerPrint} className="flex-1 sm:flex-none px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-full text-sm font-medium transition-colors flex items-center justify-center"><Printer className="w-4 h-4 mr-1.5" /> พิมพ์ (Print)</button>
                     <button onClick={triggerExportPDF} className="flex-1 sm:flex-none px-4 py-2.5 bg-teal-600 hover:bg-teal-700 text-white rounded-full text-sm font-medium shadow-sm transition-colors flex items-center justify-center"><Download className="w-4 h-4 mr-1.5" /> ส่งออก PDF รายการรวม</button>
                     <button onClick={() => setPreviewModal({show:false, data:null})} className="p-2.5 bg-slate-200 hover:bg-red-50 text-slate-500 hover:text-red-500 rounded-full transition-colors ml-auto sm:ml-0"><X className="w-5 h-5"/></button>
                  </div>
                </div>
                <div className="flex-1 overflow-y-auto p-4 sm:p-8">
                   <div className="bg-white shadow-lg mx-auto max-w-[210mm] min-h-[297mm] p-[15mm] border border-gray-300">
                       <div className="text-center text-gray-400 mb-8 border-b pb-2">--- 🖨️ หน้าจำลองรายงานหลัก ---</div>
                       <div className="print-only !block"></div>
                   </div>
                </div>
              </div>
            </div>
          )}

          {notification.show && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200 print:hidden">
              <div className="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl relative text-center animate-in zoom-in-95 duration-200 border border-slate-100">
                {notification.type !== 'loading' && !notification.autoClose && (<button onClick={() => setNotification({ ...notification, show: false })} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition-colors p-2 bg-slate-50 rounded-full"><X className="w-5 h-5" /></button>)}
                <div className="flex items-center justify-center w-20 h-20 rounded-full mx-auto mb-6 bg-slate-50 shadow-inner border border-slate-100">
                   {notification.type === 'loading' && <Loader2 className="w-10 h-10 text-teal-600 animate-spin" />}
                   {notification.type === 'success' && <CheckCircle className="w-10 h-10 text-green-500" />}
                   {notification.type === 'error' && <AlertCircle className="w-10 h-10 text-red-500" />}
                   {notification.type === 'warning' && <AlertCircle className="w-10 h-10 text-yellow-500" />}
                   {notification.type === 'info' && <Info className="w-10 h-10 text-blue-500" />}
                </div>
                <h3 className="text-xl font-bold text-slate-800 mb-3">{notification.title}</h3>
                <div className="text-slate-600 text-sm mb-6 leading-relaxed" dangerouslySetInnerHTML={notification.html ? { __html: notification.html } : undefined}>{!notification.html ? notification.text : null}</div>
                {notification.type !== 'loading' && !notification.autoClose && (<button onClick={() => setNotification({ ...notification, show: false })} className="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3.5 px-4 rounded-full shadow-md transition-colors text-base">ตกลงรับทราบ</button>)}
              </div>
            </div>
          )}

          {/* 🟢 หน้าต่าง (Modal) แจ้งเตือนเมื่อพบข้อมูลร่าง (Draft Mode) */}
          {draftPrompt && (
            <div className="fixed inset-0 z-[110] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200 print:hidden">
              <div className="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl relative animate-in zoom-in-95 duration-200 border border-slate-100">
                <div className="flex items-center justify-center w-20 h-20 bg-blue-50 border border-blue-100 rounded-full mx-auto mb-6 shadow-inner"><Save className="w-10 h-10 text-blue-500" /></div>
                <h3 className="text-xl font-bold text-center text-slate-800 mb-3">พบข้อมูลร่าง (Draft)</h3>
                <p className="text-center text-slate-600 text-sm mb-8 leading-relaxed">ระบบพบข้อมูลฟอร์มที่คุณพิมพ์ค้างไว้ล่าสุด<br/>ต้องการกู้คืนเพื่อทำต่อหรือไม่?</p>
                <div className="flex space-x-3">
                  <button onClick={() => { localStorage.removeItem('tucsear_draft'); setDraftPrompt(false); }} className="flex-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3.5 rounded-full shadow-sm transition-colors text-sm">ทิ้งข้อมูลเก่า</button>
                  <button onClick={() => { 
                      const draft = JSON.parse(localStorage.getItem('tucsear_draft'));
                      setFormData(draft);
                      setDraftPrompt(false);
                      setView('form');
                      setActiveFormTab(1);
                  }} className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-full shadow-sm transition-colors flex items-center justify-center text-sm">กู้คืนข้อมูล</button>
                </div>
              </div>
            </div>
          )}

          {deleteTarget.show && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-in fade-in duration-200 print:hidden">
              <div className="bg-white rounded-[2rem] p-8 max-w-sm w-full shadow-2xl relative animate-in zoom-in-95 duration-200 border border-slate-100">
                <div className="flex items-center justify-center w-20 h-20 bg-red-50 border border-red-100 rounded-full mx-auto mb-6 shadow-inner"><AlertCircle className="w-10 h-10 text-red-500" /></div>
                <h3 className="text-xl font-bold text-center text-slate-800 mb-3">ยืนยันการลบข้อมูล?</h3><p className="text-center text-slate-600 text-sm mb-8 leading-relaxed">คุณกำลังจะลบข้อมูลรหัส <b className="text-red-600">{deleteTarget.receivedNumber}</b><br/>การกระทำนี้ไม่สามารถย้อนกลับได้</p>
                <div className="flex space-x-3">
                  <button onClick={() => setDeleteTarget({show: false, receivedNumber: ''})} className="flex-1 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3.5 rounded-full shadow-sm transition-colors text-sm">ยกเลิก</button>
                  <button onClick={confirmDelete} className="flex-1 bg-red-600 hover:bg-red-700 text-white font-semibold py-3.5 rounded-full shadow-sm transition-colors flex items-center justify-center text-sm"><Trash2 className="w-4 h-4 mr-2" /> ยืนยันลบ</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    function getMockAdminList() {
      return {
        orders: [{ receivedNumber: "R2-630349", date: "September 2, 2020", customerName: "Assistant Professor Potjanee", status: "ผลออกแล้ว" }],
        topBacteria: [{ name: 'Streptococcus suis', count: 85 }]
      };
    }

    function getMockData(status = 'ผลออกแล้ว', code = "R2-630349") {
      return {
        receivedNumber: code, reportNumber: '-', referenceQuotation: '-', date: "September 2, 2020", status: status,
        customer: { name: "Assistant Professor Potjanee Srimanote", address: "Faculty of Allied Health Sciences" },
        sample: { sampleNameSummary: "344.2, 278.1, 439.1", receivedBy: "SS14", testedBy: "SS18", testedSampleStatus: "Out of sample", targetedAnalyte: "Bacteria Identification", dataStorage: "Yes", storageTimeYear: "5", description: "Bacterial colony on selective media agar", testReportFormat: "Other File", reportCopies: "1", receivedDate: "September 2, 2020", testedDate: "September 2, 2020" },
        method: { technique: "Matrix Assisted Laser Desorption Ionization-Time of Flight Mass Spectrometry (MALDI-TOF MS)", model: "Microflex LT/SH, Bruker Daltonics, Germany", software: "MALDI Biotyper", conditionType: "Bacteria Identification", conditionMode: "MBT Compass", conditionMatrix: "HCCA, Bruker Daltonics, Germany", standardMaterial: "Bacterial Test Standard (BTS), Bruker Daltonics", internalStandardMaterial: "-", remark: "-" },
        results: [
          {
            no: 1, sampleName: "200902-14-1", conf: "2.35", family: "Family VI Streptococcaceae", genus: "Streptococcus", species: "sp.",
            saramis: { testRef: "ANAC_000_0019_2A1[c]", acquisitionTime: "2 Sep 2020 12:18", organism: "Streptococcus sp.", scoreValue: "2.35", ncbi: "1301", comment: "" }
          }
        ]
      };
    }

    // เริ่มต้นแอปพลิเคชัน
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
