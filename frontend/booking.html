<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ปฏิทินจองวันส่งตรวจ - งานจุลชีววิทยา รพ.ธรรมศาสตร์ (TUH Microbiology)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .calendar-container {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
    }
    .calendar-day-head {
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.5rem;
      color: var(--text-muted);
      background: #f1f5f9;
      border-radius: var(--radius-sm);
    }
    .calendar-day-head.sunday { color: #ef4444; }
    .calendar-day-head.saturday { color: #8b5cf6; }
    .calendar-cell {
      min-height: 100px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.4rem;
      background: var(--bg-surface);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.2s;
    }
    .calendar-cell:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .calendar-cell.holiday {
      background: #fff1f2;
      border-color: #fecdd3;
    }
    .calendar-cell.today {
      border: 2px solid var(--primary);
    }
    .day-num {
      font-weight: 700;
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
    }
    .holiday-badge {
      font-size: 0.65rem;
      background: #fee2e2;
      color: #b91c1c;
      padding: 0.1rem 0.3rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.25rem;
      line-height: 1.2;
    }
    .booking-chip {
      font-size: 0.7rem;
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.15rem 0.35rem;
      border-radius: var(--radius-sm);
      margin-bottom: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <span class="nav-brand-badge">QUEUE</span>
      <span>ปฏิทินจองวันส่งตรวจสิ่งแวดล้อม</span>
    </a>
    <ul class="nav-menu">
      <li><a href="index.html" class="nav-link">🏠 หน้าหลัก</a></li>
      <li><a href="air.html" class="nav-link">💨 Air Sampling</a></li>
      <li><a href="booking.html" class="nav-link active">📅 ปฏิทินจอง</a></li>
      <li><a href="audit.html" class="nav-link">📋 Audit Trail</a></li>
      <li id="user-nav-item">
        <a href="login.html" class="btn btn-primary btn-sm">เข้าสู่ระบบ</a>
      </li>
    </ul>
  </nav>

  <main class="container">
    
    <div class="page-header">
      <div>
        <h1 class="page-title">ปฏิทินจองวันส่งสิ่งส่งตรวจล่วงหน้า</h1>
        <p class="page-subtitle">จองคิวส่งตรวจ น้ำ, อาหาร, อากาศ, ยา, เลือด งานจุลชีววิทยา รพ.ธรรมศาสตร์</p>
      </div>
      <button type="button" class="btn btn-primary" onclick="openBookingModal()">
        ➕ จองคิวส่งตรวจ
      </button>
    </div>

    <!-- Calendar View -->
    <div class="calendar-container">
      <div class="calendar-header">
        <h2 id="current-month-display" style="font-size: 1.25rem; font-weight: 700;"></h2>
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn btn-secondary btn-sm" onclick="changeMonth(-1)">◀ เดือนก่อนหน้า</button>
          <button class="btn btn-secondary btn-sm" onclick="resetToday()">วันนี้</button>
          <button class="btn btn-secondary btn-sm" onclick="changeMonth(1)">เดือนถัดไป ▶</button>
        </div>
      </div>

      <div class="calendar-grid">
        <div class="calendar-day-head sunday">อา.</div>
        <div class="calendar-day-head">จ.</div>
        <div class="calendar-day-head">อ.</div>
        <div class="calendar-day-head">พ.</div>
        <div class="calendar-day-head">พฤ.</div>
        <div class="calendar-day-head">ศ.</div>
        <div class="calendar-day-head saturday">ส.</div>
      </div>

      <div class="calendar-grid" id="calendar-days" style="margin-top: 0.5rem;">
        <!-- Calendar day cells loaded dynamically -->
      </div>
    </div>

  </main>

  <!-- Modal: Booking Form -->
  <div class="modal-backdrop" id="booking-modal" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">📅 ฟอร์มจองคิวส่งตรวจล่วงหน้า</h3>
        <button class="close-btn" onclick="closeBookingModal()">&times;</button>
      </div>
      
      <form id="booking-form">
        <div class="form-group">
          <label class="form-label" for="book-date">วันที่ต้องการส่งตรวจ (Date) *</label>
          <input type="date" id="book-date" class="form-control" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="book-test-type">ประเภทการตรวจ (Test Type) *</label>
          <select id="book-test-type" class="form-control" required>
            <option value="อากาศ">อากาศ (Air Sampling)</option>
            <option value="น้ำ">น้ำ (Water / OR / THAMC)</option>
            <option value="อาหาร">อาหาร (Food)</option>
            <option value="ยา">ยาเตรียม (Drug)</option>
            <option value="เลือด">เลือด / ธนาคารเลือด (Sterility)</option>
            <option value="Stool checkup">Stool checkup</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="book-dept">หน่วยงานผู้จอง (Department) *</label>
          <select id="book-dept" class="form-control" required>
            <option value="">-- เลือกหน่วยงาน --</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="book-name">ชื่อผู้จอง (Full Name) *</label>
            <input type="text" id="book-name" class="form-control" placeholder="ชื่อ-สกุล ผู้ติดต่อ" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="book-phone">เบอร์โทรศัพท์ติดต่อ (Phone) *</label>
            <input type="text" id="book-phone" class="form-control" placeholder="เบอร์ภายใน หรือมือถือ" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="book-count">จำนวนตัวอย่างโดยประมาณ (Estimated Samples)</label>
          <input type="number" id="book-count" class="form-control" min="1" max="200" value="5" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="book-remarks">หมายเหตุ (Remarks)</label>
          <textarea id="book-remarks" class="form-control" rows="2" placeholder="ข้อมูลเพิ่มเติม เช่น จุดเก็บตัวอย่างพิเศษ"></textarea>
        </div>

        <div style="display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" onclick="closeBookingModal()">ยกเลิก</button>
          <button type="submit" class="btn btn-primary">ยืนยันการจองคิว</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    let currentDate = new Date();
    let holidaysList = [];
    let bookingsList = [];
    let departmentsList = [];

    const monthNamesThai = [
      'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
      'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
    ];

    document.addEventListener('DOMContentLoaded', async () => {
      checkAuth();
      await loadInitialData();
      renderCalendar();

      document.getElementById('booking-form').addEventListener('submit', handleBookingSubmit);
    });

    function checkAuth() {
      const user = Api.getUser();
      const navItem = document.getElementById('user-nav-item');
      if (user) {
        navItem.innerHTML = `
          <div class="user-badge">
            <span>👤 ${user.full_name}</span>
            <button onclick="Api.clearAuth(); window.location.href='login.html';" class="btn btn-secondary btn-sm" style="padding: 0.2rem 0.4rem;">ออก</button>
          </div>
        `;
      }
    }

    async function loadInitialData() {
      try {
        [holidaysList, departmentsList] = await Promise.all([
          Api.getHolidays(),
          Api.getDepartments()
        ]);

        const deptSelect = document.getElementById('book-dept');
        deptSelect.innerHTML = '<option value="">-- เลือกหน่วยงาน --</option>' + 
          departmentsList.map(d => `<option value="${d.name_th}">${d.name_th}</option>`).join('');

      } catch (err) {
        console.error('Error loading master booking data:', err);
      }
    }

    async function fetchMonthBookings(year, month) {
      const startStr = `${year}-${String(month + 1).padStart(2, '0')}-01`;
      const lastDay = new Date(year, month + 1, 0).getDate();
      const endStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(lastDay).padStart(2, '0')}`;
      
      try {
        bookingsList = await Api.getBookings({ start_date: startStr, end_date: endStr });
      } catch (err) {
        bookingsList = [];
      }
    }

    async function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const thYear = year + 543;
      document.getElementById('current-month-display').innerText = `${monthNamesThai[month]} พ.ศ. ${thYear}`;

      await fetchMonthBookings(year, month);

      const firstDayIdx = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const container = document.getElementById('calendar-days');
      container.innerHTML = '';

      // Blank cells for days before month start
      for (let i = 0; i < firstDayIdx; i++) {
        container.insertAdjacentHTML('beforeend', `<div class="calendar-cell" style="background:#f8fafc; border:none; cursor:default;"></div>`);
      }

      const today = new Date();

      for (let day = 1; day <= daysInMonth; day++) {
        const dateKey = `${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const fullDateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        const holiday = holidaysList.find(h => h.date === dateKey);
        const dayBookings = bookingsList.filter(b => b.booking_date === fullDateStr);

        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;

        let holidayHtml = holiday ? `<div class="holiday-badge">🎌 ${holiday.name}</div>` : '';
        let bookingsHtml = dayBookings.map(b => `
          <div class="booking-chip" title="${b.department_name}: ${b.test_type} (${b.sample_count} ตัวอย่าง)">
            ${b.test_type} - ${b.department_name || b.full_name} (${b.sample_count})
          </div>
        `).join('');

        container.insertAdjacentHTML('beforeend', `
          <div class="calendar-cell ${holiday ? 'holiday' : ''} ${isToday ? 'today' : ''}" onclick="selectDateForBooking('${fullDateStr}')">
            <div class="day-num">${day}</div>
            ${holidayHtml}
            ${bookingsHtml}
          </div>
        `);
      }
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    function resetToday() {
      currentDate = new Date();
      renderCalendar();
    }

    function selectDateForBooking(dateStr) {
      document.getElementById('book-date').value = dateStr;
      openBookingModal();
    }

    function openBookingModal() {
      document.getElementById('booking-modal').style.display = 'flex';
    }

    function closeBookingModal() {
      document.getElementById('booking-modal').style.display = 'none';
    }

    async function handleBookingSubmit(e) {
      e.preventDefault();
      const bDate = document.getElementById('book-date').value;
      const tType = document.getElementById('book-test-type').value;
      const dName = document.getElementById('book-dept').value;
      const fName = document.getElementById('book-name').value.trim();
      const cPhone = document.getElementById('book-phone').value.trim();
      const sCount = parseInt(document.getElementById('book-count').value) || 1;
      const remarks = document.getElementById('book-remarks').value.trim();

      try {
        await Api.createBooking({
          booking_date: bDate,
          test_type: tType,
          department_name: dName,
          full_name: fName,
          contact_number: cPhone,
          sample_count: sCount,
          remarks: remarks
        });
        alert('จองคิวส่งตรวจเรียบร้อยแล้ว!');
        closeBookingModal();
        renderCalendar();
      } catch (err) {
        alert('เกิดข้อผิดพลาด: ' + err.message);
      }
    }
  </script>
</body>
</html>
