<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบเจ้าหน้าที่ - TUH Microbiology</title>
  
  <!-- Google Fonts: Sarabun & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Sarabun', 'sans-serif'],
            heading: ['Kanit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: 'Sarabun', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-emerald-950 text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background Decorative Grid -->
  <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#10b981_1px,transparent_1px)] [background-size:16px_16px]"></div>

  <div class="max-w-md w-full relative z-10">
    
    <!-- Brand Title -->
    <div class="text-center mb-6">
      <a href="index.html" class="inline-flex items-center gap-3 group">
        <div class="w-12 h-12 rounded-2xl bg-white/10 p-1.5 flex items-center justify-center border border-white/20 group-hover:border-emerald-400 transition shadow-lg">
          <img src="https://img1.pic.in.th/images/core-value-2024.png" alt="TUH Logo" class="h-9 w-auto object-contain" onerror="this.onerror=null; this.src='https://placehold.co/100x100/059669/ffffff?text=TUH';">
        </div>
      </a>
      <h1 class="text-xl font-bold font-heading text-white mt-3 tracking-wide">
        TUH MICROBIOLOGY PORTAL
      </h1>
      <p class="text-xs text-slate-400">
        ระบบบันทึกและจัดการผลตรวจสิ่งแวดล้อม มาตรฐาน ISO 15189
      </p>
    </div>

    <!-- Login Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 border border-slate-100 space-y-6">
      <div>
        <h2 class="text-lg font-bold font-heading text-slate-900">
          เข้าสู่ระบบเจ้าหน้าที่ (Sign In)
        </h2>
        <p class="text-xs text-slate-500 mt-0.5">
          กรอกอีเมลและรหัสผ่านเพื่อเข้าสู่ส่วนงานจัดการ
        </p>
      </div>

      <!-- Alert Box -->
      <div id="login-error-alert" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-xl text-rose-700 text-xs flex items-center gap-2">
        <i class="fas fa-circle-exclamation shrink-0"></i>
        <span id="login-error-text">ข้อมูลไม่ถูกต้อง</span>
      </div>

      <form id="staff-login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1.5" for="login-email">อีเมลเจ้าหน้าที่ (Email)</label>
          <div class="relative">
            <i class="fas fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="email" id="login-email" class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-hidden text-slate-800" placeholder="staff@hospital.tu.ac.th" required>
          </div>
        </div>

        <div>
          <label class="block font-bold text-slate-700 mb-1.5" for="login-password">รหัสผ่าน (Password)</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="password" id="login-password" class="w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-hidden text-slate-800" placeholder="••••••••" required>
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
              <i id="password-toggle-icon" class="fas fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-login-submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition shadow-lg shadow-emerald-900/20 text-xs sm:text-sm flex items-center justify-center gap-2">
          <i class="fas fa-right-to-bracket"></i>
          <span>เข้าสู่ระบบ</span>
        </button>
      </form>

      <!-- Quick 1-Click Demo Accounts for testing -->
      <div class="pt-4 border-t border-slate-100 text-xs">
        <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 text-center">
          บัญชีทดสอบด่วน (1-Click Demo)
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="fillDemoCredentials('admin@tuh.lab', 'password123')" class="p-2 bg-slate-50 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl border border-slate-200 text-left transition">
            <div class="font-bold text-[11px]">ทนพ.มานพ (Admin)</div>
            <div class="text-[10px] text-slate-400">admin@tuh.lab</div>
          </button>
          <button onclick="fillDemoCredentials('staff@tuh.lab', 'password123')" class="p-2 bg-slate-50 hover:bg-emerald-50 text-slate-700 hover:text-emerald-700 rounded-xl border border-slate-200 text-left transition">
            <div class="font-bold text-[11px]">เจ้าหน้าที่ปฏิบัติการ</div>
            <div class="text-[10px] text-slate-400">staff@tuh.lab</div>
          </button>
        </div>
      </div>

      <div class="text-center pt-2">
        <a href="index.html" class="text-xs text-slate-500 hover:text-emerald-600 transition flex items-center justify-center gap-1">
          <i class="fas fa-arrow-left"></i> กลับสู่หน้าหลัก
        </a>
      </div>

    </div>

  </div>

  <!-- JS Dependencies -->
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // If already logged in, redirect to admin
      await window.AuthManager.redirectIfAuthenticated('admin.html');
    });

    function togglePasswordVisibility() {
      const pwd = document.getElementById('login-password');
      const icon = document.getElementById('password-toggle-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function fillDemoCredentials(email, pwd) {
      document.getElementById('login-email').value = email;
      document.getElementById('login-password').value = pwd;
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');
      const errAlert = document.getElementById('login-error-alert');
      const errText = document.getElementById('login-error-text');

      errAlert.classList.add('hidden');
      btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-1"></i> กำลังตรวจสอบ...`;
      btn.disabled = true;

      try {
        const { user, error } = await window.AuthManager.signIn(email, password);
        
        if (error) {
          errText.textContent = error.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
          errAlert.classList.remove('hidden');
        } else {
          // Success, redirect
          const urlParams = new URLSearchParams(window.location.search);
          const redirectUrl = urlParams.get('redirect') ? decodeURIComponent(urlParams.get('redirect')) : 'admin.html';
          window.location.href = redirectUrl;
        }
      } catch (err) {
        errText.textContent = err.message || 'เกิดข้อผิดพลาดในการเชื่อมต่อ';
        errAlert.classList.remove('hidden');
      } finally {
        btn.innerHTML = `<i class="fas fa-right-to-bracket"></i> <span>เข้าสู่ระบบ</span>`;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
