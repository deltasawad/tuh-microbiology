<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ - TUH Microbiology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .login-container {
      max-width: 440px;
      margin: 3.5rem auto;
      padding: 1.5rem;
    }
    .login-card {
      background: #ffffff;
      border: 1px solid var(--border-card);
      border-radius: var(--radius-card);
      padding: 2.25rem;
      box-shadow: var(--shadow-card);
    }
    .login-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }
    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--header-bg);
      border: 2px solid var(--accent-gold);
      color: var(--accent-gold);
      font-weight: 800;
      font-size: 1.25rem;
      margin-bottom: 0.75rem;
    }
    .demo-accounts {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--border-card);
      font-size: 0.85rem;
    }
    .demo-btn-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }
    .demo-btn {
      background: #f8faf9;
      border: 1px solid var(--border-card);
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius-sm);
      text-align: left;
      cursor: pointer;
      font-size: 0.82rem;
      transition: all 0.2s;
    }
    .demo-btn:hover {
      border-color: var(--accent-gold);
      background: var(--accent-gold-light);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <a href="index.html" class="brand-section">
      <div class="brand-logo-circle">TU</div>
      <div class="brand-text-container">
        <span class="brand-main-title">MICROBIOLOGY</span>
        <span class="brand-sub-title">THAMMASAT HOSPITAL</span>
      </div>
    </a>
  </header>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">TU</div>
        <h1 style="font-size: 1.35rem; font-weight: 800; color: var(--text-dark);">เข้าสู่ระบบ (Sign In)</h1>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">
          ระบบรายงานผลตรวจสิ่งแวดล้อม มาตรฐาน ISO 15189
        </p>
      </div>

      <div id="error-alert" style="display: none; background: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; padding: 0.75rem; border-radius: var(--radius-sm); font-size: 0.85rem; margin-bottom: 1rem;">
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">ชื่อผู้ใช้งาน (Username)</label>
          <input type="text" id="username" class="form-control" placeholder="ระบุ username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">รหัสผ่าน (Password)</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-send-gold" style="width: 100%; margin-top: 0.5rem; padding: 0.65rem;" id="login-btn">
          เข้าสู่ระบบ
        </button>
      </form>

      <!-- Quick Test Login Accounts -->
      <div class="demo-accounts">
        <div style="font-weight: 600; color: var(--text-muted); margin-bottom: 0.4rem;">
          🔑 บัญชีทดสอบระบบตามบทบาท (Role Accounts):
        </div>
        <div class="demo-btn-group">
          <button type="button" class="demo-btn" onclick="fillAccount('admin', 'AdminTUH@2026!')">
            👑 <strong>Admin</strong>: ผู้ดูแลระบบสูงสุด
          </button>
          <button type="button" class="demo-btn" onclick="fillAccount('tech_manop', 'Tech@1234')">
            🔬 <strong>Technician</strong>: ทนพ.มานพ (ผู้ตรวจ/รายงานผล)
          </button>
          <button type="button" class="demo-btn" onclick="fillAccount('approver_narisara', 'Approver@1234')">
            🛡️ <strong>Approver</strong>: ทนพญ.นริศรา (ผู้อนุมัติผลตรวจ)
          </button>
          <button type="button" class="demo-btn" onclick="fillAccount('occhealth', 'Occ@1234')">
            🏥 <strong>Requester</strong>: งานอาชีวอนามัย (หน่วยงานส่งตรวจ)
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    function fillAccount(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;
      const btn = document.getElementById('login-btn');
      const errBox = document.getElementById('error-alert');

      btn.disabled = true;
      btn.innerText = 'กำลังเข้าสู่ระบบ...';
      errBox.style.display = 'none';

      try {
        const res = await Api.login(u, p);
        Api.setAuth(res.access_token, res.refresh_token, res.user_info);
        window.location.href = 'index.html';
      } catch (err) {
        errBox.style.display = 'block';
        errBox.innerText = err.message || 'เข้าสู่ระบบไม่สำเร็จ';
      } finally {
        btn.disabled = false;
        btn.innerText = 'เข้าสู่ระบบ';
      }
    });
  </script>
</body>
</html>
