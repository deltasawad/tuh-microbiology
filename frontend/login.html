<!DOCTYPE html>
<html lang="th" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบเจ้าหน้าที่ - TUH Microbiology</title>
  
  <!-- Favicon / Logo -->
  <link rel="icon" type="image/png" href="images/tuh-logo.png">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="images/tuh-logo.png">
  
  <!-- Google Fonts: Noto Sans Thai -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            kprimary: { DEFAULT: '#6c5070', light: '#8d7092', dark: '#503854', subtle: '#f7f2f8' },
            kcoral: { DEFAULT: '#df6a6a', light: '#f59595', dark: '#c25353', subtle: '#fdf0f0' },
            ksage: { DEFAULT: '#c2dbc1', dark: '#527c51', subtle: '#f2f8f2' },
            kgold: { DEFAULT: '#f9d56e', dark: '#b8860b', subtle: '#fefaf0' },
            kbg: '#faf7f5'
          },
          fontFamily: {
            sans: ['"Noto Sans Thai"', 'sans-serif'],
            heading: ['"Noto Sans Thai"', 'sans-serif']
          },
          borderRadius: {
            '2xl': '1.25rem',
            '3xl': '1.75rem',
            '4xl': '2.25rem'
          }
        }
      }
    }
  </script>
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css?v=3.0">
</head>
<body class="bg-[#faf7f5] text-[#342838] min-h-screen flex items-center justify-center p-4 sm:p-6 antialiased">

  <div class="w-full max-w-md">
    
    <!-- Top Brand Header -->
    <div class="text-center mb-6">
      <a href="index.html" class="inline-flex flex-col items-center gap-3 group">
        <div class="w-20 h-20 rounded-3xl bg-white p-2 flex items-center justify-center border border-[#6c5070]/15 shadow-sm group-hover:scale-105 transition">
          <img src="images/tuh-logo.png" alt="TUH Logo" class="w-16 h-16 object-contain drop-shadow-sm" onerror="this.onerror=null; this.src='https://placehold.co/100x100/6c5070/ffffff?text=TUH';">
        </div>
        <div>
          <h1 class="text-xl sm:text-2xl font-bold font-heading text-[#342838] tracking-tight">
            TUH MICROBIOLOGY
          </h1>
          <div class="text-xs text-[#df6a6a] font-semibold mt-0.5">
            งานจุลชีววิทยา โรงพยาบาลธรรมศาสตร์เฉลิมพระเกียรติ
          </div>
        </div>
      </a>
    </div>

    <!-- Login Card (K-Minimal Rounded 3XL) -->
    <div class="k-card p-6 sm:p-8 rounded-4xl space-y-6">
      
      <div class="border-b border-[#6c5070]/10 pb-4 text-center">
        <h2 class="text-base sm:text-lg font-bold font-heading text-[#342838]">
          เข้าสู่ระบบเจ้าหน้าที่ (Staff Portal)
        </h2>
        <p class="text-xs text-[#78687e] mt-1">
          กรอกชื่อผู้ใช้และรหัสผ่านเพื่อเข้าใช้งานตามสิทธิ์หน่วยงาน
        </p>
      </div>

      <!-- Error Alert -->
      <div id="login-error-alert" class="hidden p-3.5 bg-[#fdf0f0] border border-[#f9d2d2] rounded-2xl text-xs text-[#842b2b] flex items-center gap-2">
        <i class="fas fa-circle-exclamation text-[#df6a6a] text-sm shrink-0"></i>
        <span id="login-error-text">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
      </div>

      <!-- Login Form -->
      <form id="staff-login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
        
        <!-- Username -->
        <div>
          <label class="block font-bold text-xs text-[#342838] mb-1.5" for="login-username">
            ชื่อผู้ใช้งาน (Username / รหัสหน่วยงาน)
          </label>
          <div class="relative">
            <i class="fas fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-[#a494aa] text-xs"></i>
            <input type="text" id="login-username" required class="w-full pl-9 pr-3.5 py-2.5 bg-[#faf7f5] border border-[#6c5070]/15 rounded-2xl text-xs font-semibold text-[#342838] focus:bg-white focus:ring-2 focus:ring-[#6c5070] focus:outline-hidden transition" placeholder="เช่น pharma, thamc, occ, icn, bloodbank, admin">
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block font-bold text-xs text-[#342838]" for="login-password">
              รหัสผ่าน (Password)
            </label>
          </div>
          <div class="relative">
            <i class="fas fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-[#a494aa] text-xs"></i>
            <input type="password" id="login-password" required class="w-full pl-9 pr-10 py-2.5 bg-[#faf7f5] border border-[#6c5070]/15 rounded-2xl text-xs font-semibold text-[#342838] focus:bg-white focus:ring-2 focus:ring-[#6c5070] focus:outline-hidden transition" placeholder="กรอกรหัสผ่าน">
            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#a494aa] hover:text-[#342838]">
              <i id="password-toggle-icon" class="fas fa-eye text-xs"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="btn-login-submit" class="k-btn-primary w-full text-xs font-bold py-3 rounded-2xl flex items-center justify-center gap-2 shadow-md mt-2">
          <i class="fas fa-right-to-bracket text-[#f9d56e]"></i>
          <span>เข้าสู่ระบบ</span>
        </button>

      </form>

      <!-- Quick Account Helpers — ซ่อนไว้แล้ว (คลาส hidden)
           เหตุผล: แสดงชื่อผู้ใช้และรหัสผ่านของทุกบัญชีบนหน้าล็อกอิน ใครที่เปิดหน้านี้ก็เห็นรหัสทั้งหมด
           ถ้าต้องการใช้ตอนทดสอบ ให้ลบคำว่า hidden ออกจาก div ด้านล่าง -->
      <div class="hidden pt-4 border-t border-[#6c5070]/10">
        <div class="text-[11px] font-bold text-[#78687e] mb-2.5 text-center">
          ⚡ ปุ่มลัดเลือกบัญชีทดสอบด่วน:
        </div>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <button type="button" onclick="fillAndLogin('pharma', '8418')" class="p-2 rounded-xl bg-[#fefaf0] hover:bg-[#faebd7] text-[#975a16] font-bold text-left transition border border-[#fde8a8] flex items-center gap-1.5 shadow-2xs">
            <span class="w-2 h-2 rounded-full bg-amber-500 shrink-0"></span>
            <span class="truncate">ผลิตยา 2 (pharma: 8418)</span>
          </button>
          <button type="button" onclick="fillAndLogin('thamc', '020780086')" class="p-2 rounded-xl bg-[#ecfeff] hover:bg-[#cffafe] text-[#0e7490] font-bold text-left transition border border-[#a5f3fc] flex items-center gap-1.5 shadow-2xs">
            <span class="w-2 h-2 rounded-full bg-cyan-500 shrink-0"></span>
            <span class="truncate">THAMC (ศูนย์การแพทย์)</span>
          </button>
          <button type="button" onclick="fillAndLogin('compounding', '9907')" class="p-2 rounded-xl bg-[#fdf0f0] hover:bg-[#fae1e1] text-[#df6a6a] font-bold text-left transition border border-[#f9d2d2] flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-[#df6a6a] shrink-0"></span>
            <span class="truncate">ผลิตยา 1 ปลอดเชื้อ</span>
          </button>
          <button type="button" onclick="fillAndLogin('occ', '8416')" class="p-2 rounded-xl bg-[#f7f2f8] hover:bg-[#efe6f0] text-[#6c5070] font-bold text-left transition border border-[#6c5070]/15 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-[#6c5070] shrink-0"></span>
            <span class="truncate">อาชีวอนามัย (occ)</span>
          </button>
          <button type="button" onclick="fillAndLogin('icn', '9341')" class="p-2 rounded-xl bg-[#f0f9ff] hover:bg-[#e0f2fe] text-[#0369a1] font-bold text-left transition border border-[#bae6fd] flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-[#0284c7] shrink-0"></span>
            <span class="truncate">ควบคุมโรค IC (icn)</span>
          </button>
          <button type="button" onclick="fillAndLogin('bloodbank', '9863')" class="p-2 rounded-xl bg-[#fdf2f8] hover:bg-[#fce7f3] text-[#be185d] font-bold text-left transition border border-[#fbcfe8] flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-rose-500 shrink-0"></span>
            <span class="truncate">ธนาคารเลือด (bloodbank)</span>
          </button>
          <button type="button" onclick="fillAndLogin('nutrition', '8406')" class="p-2 rounded-xl bg-[#f2f8f2] hover:bg-[#e4f1e4] text-[#3d5e3c] font-bold text-left transition border border-[#dbe9da] flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
            <span class="truncate">โภชนาการ (nutrition)</span>
          </button>
          <button type="button" onclick="fillAndLogin('admin', 'admin123')" class="p-2 rounded-xl bg-[#faf5ff] hover:bg-[#f3e8ff] text-[#7e22ce] font-bold text-left transition border border-[#e9d5ff] flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-purple-600 shrink-0"></span>
            <span class="truncate">ผู้ดูแลระบบ (Admin)</span>
          </button>
        </div>
      </div>

      <!-- Back to Home -->
      <div class="text-center pt-2">
        <a href="index.html" class="inline-flex items-center gap-1.5 text-xs text-[#78687e] hover:text-[#6c5070] font-semibold transition">
          <i class="fas fa-arrow-left"></i> กลับสู่หน้าหลัก
        </a>
      </div>

    </div>

  </div>

  <!-- JS Dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=3.0"></script>
  <script src="js/auth.js?v=3.0"></script>
  <script>
    function togglePasswordVisibility() {
      const pwd = document.getElementById('login-password');
      const icon = document.getElementById('password-toggle-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        pwd.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    async function fillAndLogin(user, pwd) {
      document.getElementById('login-username').value = user;
      document.getElementById('login-password').value = pwd;
      
      const form = document.getElementById('staff-login-form');
      form.dispatchEvent(new Event('submit'));
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');
      const errAlert = document.getElementById('login-error-alert');
      const errText = document.getElementById('login-error-text');

      errAlert.classList.add('hidden');
      btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-1"></i> กำลังตรวจสอบสิทธิ์...`;
      btn.disabled = true;

      try {
        const { user, error } = await window.AuthManager.signIn(username, password);
        
        if (error) {
          errText.textContent = error.message || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
          errAlert.classList.remove('hidden');
        } else {
          // Success
          Swal.fire({
            icon: 'success',
            title: `ยินดีต้อนรับ`,
            text: `${user.displayName}`,
            timer: 1000,
            showConfirmButton: false,
            customClass: { popup: 'k-swal' }
          }).then(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const explicitRedirect = urlParams.get('redirect');
            if (explicitRedirect && !explicitRedirect.includes('login.html')) {
              window.location.href = decodeURIComponent(explicitRedirect);
            } else if (user.defaultRedirect) {
              window.location.href = user.defaultRedirect;
            } else if (user.serviceCode) {
              window.location.href = `workflow.html?tab=submission&service=${user.serviceCode}`;
            } else {
              window.location.href = 'workflow.html';
            }
          });
        }
      } catch (err) {
        errText.textContent = err.message || 'เกิดข้อผิดพลาดในการตรวจสอบสิทธิ์';
        errAlert.classList.remove('hidden');
      } finally {
        btn.innerHTML = `<i class="fas fa-right-to-bracket text-[#f9d56e]"></i> <span>เข้าสู่ระบบ</span>`;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
