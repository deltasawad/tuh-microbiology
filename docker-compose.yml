version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tuh_micro_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tuh_microbiology}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ChangeMeSecurePassword123!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tuh_microbiology}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tuh_micro_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-ChangeMeSecurePassword123!}@db:5432/${POSTGRES_DB:-tuh_microbiology}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-c9284fa6e3d298b417c80ef748b92d04a6e84d2f091482ba83}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - AUTH_PROVIDER=local
      - STORAGE_PATH=/app/storage
      - CORS_ORIGINS=["*"]
    volumes:
      - report_storage:/app/storage
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: tuh_micro_nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - report_storage:/usr/share/nginx/html/storage:ro

volumes:
  pgdata:
  report_storage:
